name: Build, Test & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  JAVA_VERSION: '21'

jobs:
  # ── Build & Test ──────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Validate YAML config files (duplicate-key aware)
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise ValueError(f"duplicate key: {key}")
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, construct_mapping
          )

          files = sorted(glob.glob("src/**/application*.yml", recursive=True)) + ["render.yaml"]
          failed = False
          for f in files:
              try:
                  with open(f) as fh:
                      yaml.load(fh, Loader=UniqueKeyLoader)
                  print(f"OK   {f}")
              except Exception as e:
                  print(f"FAIL {f}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Package JAR
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw --batch-mode --no-transfer-progress sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-drift-engine-jar
          path: target/*.jar
          retention-days: 7

  # ── Smoke test against real PostgreSQL (prod profile) ─────────
  smoke-test-postgres:
    name: Smoke Test (PostgreSQL 15, prod profile)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: apidrift
          POSTGRES_USER: apidrift
          POSTGRES_PASSWORD: apidrift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apidrift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run prod-profile smoke test (Flyway + context load)
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: apidrift
          DB_USERNAME: apidrift
          DB_PASSWORD: apidrift
          ADMIN_PASSWORD: smoke-test-admin-password
          AES_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=ProdSmokeTest -DrunIntegration=true

  # ── Publish Docker image (main branch only) ───────────────────
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, smoke-test-postgres]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest

      - name: Build image (load into local daemon, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy results to security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
